---
# Standalone board build: the Pawpaw carries its own bring-up keymap, so no
# shield is needed. Artifact will be pawpaw-zmk.uf2.
#
# snippet: zmk-usb-logging adds a USB CDC serial port carrying the ZMK log.
# It must be applied as a SNIPPET, not as a bare CONFIG_ZMK_USB_LOGGING=y -
# the snippet also supplies an overlay creating the cdc-acm-uart node and
# pointing chosen zephyr,console at it. Without that overlay the build fails,
# because the Kconfig selects USB_UART_CONSOLE with no console device to bind.
#
# TEMPORARY: drop the snippet line once the underglow issue is diagnosed.
include:
  - board: pawpaw
    snippet: zmk-usb-logging
